name: FieldProof uptime
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the hosted app and database
        env:
          FIELDPROOF_URL: https://fieldproof-vercel.vercel.app
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 20 "$FIELDPROOF_URL/api/status" > health.json
          python3 -c 'import json; assert json.load(open("health.json"))["status"] == "ok"'
